apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: navyojana
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/shiva-555/three-tier-dockerapp.git
    targetRevision: main
    path: helm/navyojana

    helm:
      releaseName: navyojana

  destination:
    server: https://kubernetes.default.svc
    namespace: navyojana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
