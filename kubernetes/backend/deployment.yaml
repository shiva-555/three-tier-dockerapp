apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: navyojana
  labels:
    app: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: 069301570663.dkr.ecr.us-east-2.amazonaws.com/backend:16

        imagePullPolicy: Always

        ports:
        - containerPort: 3500

        env:
        - name: host
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_HOST

        - name: database
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_NAME

        - name: user
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USER

        - name: password
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"

          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          tcpSocket:
            port: 3500
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 3500
          initialDelaySeconds: 15
          periodSeconds: 5
---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: navyojana

spec:
  selector:
    app: backend

  ports:
  - protocol: TCP
    port: 3500
    targetPort: 3500

  type: ClusterIP
