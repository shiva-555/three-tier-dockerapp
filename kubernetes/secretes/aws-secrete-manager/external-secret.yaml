apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: navyojana

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore

  target:
    name: backend-secret
    creationPolicy: Owner

  data:
    - secretKey: DB_USER
      remoteRef:
        key: navyojana/backend
        property: DB_USER

    - secretKey: DB_PASSWORD
      remoteRef:
        key: navyojana/backend
        property: DB_PASSWORD
